<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030705;
    --bg-panel: #081410;
    --bg-panel-2: #0b1a14;
    --line: rgba(57,255,140,0.16);
    --line-strong: rgba(57,255,140,0.35);
    --neon: #39ff8c;
    --neon-dim: #1c8a4f;
    --neon-glow: rgba(57,255,140,0.45);
    --magenta: #ff3d81;
    --magenta-glow: rgba(255,61,129,0.4);
    --amber: #ffd23d;
    --text: #dcfbea;
    --muted: #5f8a76;
    --muted-2: #3c5f4e;
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
  }

  body {
    padding: 18px 14px 60px;
    position: relative;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(57,255,140,0.07), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(255,61,129,0.05), transparent 40%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(57,255,140,0.035) 0px,
      rgba(57,255,140,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity: 0.5;
    z-index: 999;
    mix-blend-mode: overlay;
  }

  .wrap { max-width: 620px; margin: 0 auto; }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 14px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .masthead h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.3px;
    margin: 0;
    color: var(--neon);
    text-shadow: 0 0 14px var(--neon-glow);
  }

  .masthead h1 .cursor {
    display: inline-block;
    width: 9px;
    height: 18px;
    background: var(--neon);
    margin-left: 4px;
    vertical-align: -3px;
    box-shadow: 0 0 10px var(--neon-glow);
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .masthead .pair {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 18px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    padding: 3px;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }

  .tab-btn {
    flex: 1;
    padding: 11px 8px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .tab-btn.active {
    color: #04120a;
    background: var(--neon);
    font-weight: 600;
    box-shadow: 0 0 18px var(--neon-glow);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .panel {
    background: linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border: 1px solid var(--line);
    padding: 18px;
    margin-bottom: 14px;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  }

  .panel-title {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 14px 0;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before { content: ""; width: 6px; height: 6px; background: var(--neon); box-shadow: 0 0 8px var(--neon-glow); }

  .form-group { margin-bottom: 14px; }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  input, textarea {
    width: 100%;
    padding: 11px 12px;
    background: #03100a;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    border-radius: 0;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--neon);
    box-shadow: 0 0 0 1px var(--neon), 0 0 12px var(--neon-glow);
  }

  input::placeholder, textarea::placeholder { color: var(--muted-2); }

  .datetime-row { display: flex; gap: 8px; }
  .datetime-row input { flex: 1; }
  .btn-now {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--neon);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 0 12px;
    cursor: pointer;
  }
  .btn-now:hover { background: rgba(57,255,140,0.08); }

  /* Segmented position control */
  .seg { display: flex; border: 1px solid var(--line); }
  .seg input { display: none; }
  .seg label {
    flex: 1;
    text-align: center;
    padding: 11px 0;
    margin: 0;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s ease;
  }
  .seg input#posBuy:checked ~ label[for="posBuy"] { background: rgba(57,255,140,0.14); color: var(--neon); box-shadow: inset 0 0 12px var(--neon-glow); }
  .seg input#posSell:checked ~ label[for="posSell"] { background: rgba(255,61,129,0.14); color: var(--magenta); box-shadow: inset 0 0 12px var(--magenta-glow); }
  .seg label:first-of-type { border-right: 1px solid var(--line); }

  /* Live preview */
  .preview {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .preview .cell { background: #03100a; padding: 10px 12px; }
  .preview .cell .k { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .preview .cell .v { font-size: 15px; font-weight: 600; color: var(--text); }
  .preview .cell .v.pos { color: var(--neon); }
  .preview .cell .v.neg { color: var(--magenta); }
  .preview .cell .v.warn { color: var(--amber); font-size: 12px; }

  button.submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--neon);
    color: #04120a;
    border: none;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: 0 0 20px var(--neon-glow);
    transition: transform 0.1s ease, box-shadow 0.15s ease;
  }
  button.submit-btn:hover { box-shadow: 0 0 30px var(--neon-glow); }
  button.submit-btn:active { transform: scale(0.99); }
  button.submit-btn:disabled { opacity: 0.5; cursor: default; box-shadow: none; }

  #statusMessage {
    text-align: center;
    font-size: 12px;
    margin-top: 12px;
    min-height: 16px;
  }
  #statusMessage.ok { color: var(--neon); }
  #statusMessage.err { color: var(--magenta); }

  /* Dashboard */
  .month-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .month-nav button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--neon);
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  .month-nav button:hover { background: rgba(57,255,140,0.08); }
  .month-nav input { flex: 1; }

  .metric-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .metric-grid.wide-first .metric:first-child { grid-column: 1 / -1; }

  .metric {
    background: var(--bg-panel);
    padding: 14px 14px;
  }
  .metric .k { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
  .metric .v { font-size: 22px; font-weight: 700; font-family: var(--font-display); }
  .metric .v.pos { color: var(--neon); text-shadow: 0 0 10px var(--neon-glow); }
  .metric .v.neg { color: var(--magenta); text-shadow: 0 0 10px var(--magenta-glow); }
  .metric .v.neutral { color: var(--text); }

  .equity-box { padding: 4px 0 0; }
  .equity-box svg { width: 100%; height: 90px; display: block; }
  .equity-empty { text-align: center; font-size: 12px; color: var(--muted); padding: 24px 0; }

  table.trade-log { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.trade-log th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    padding: 6px 6px;
    border-bottom: 1px solid var(--line);
    font-size: 10px;
  }
  table.trade-log td {
    padding: 8px 6px;
    border-bottom: 1px solid rgba(57,255,140,0.08);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90px;
  }
  table.trade-log tr:last-child td { border-bottom: none; }
  .badge { padding: 2px 7px; font-size: 10px; font-weight: 700; }
  .badge.win { color: var(--neon); background: rgba(57,255,140,0.12); }
  .badge.loss { color: var(--magenta); background: rgba(255,61,129,0.12); }
  .badge.bep { color: var(--amber); background: rgba(255,210,61,0.12); }
  .log-scroll { max-height: 280px; overflow-y: auto; }
  .log-scroll::-webkit-scrollbar { width: 6px; }
  .log-scroll::-webkit-scrollbar-thumb { background: var(--neon-dim); }

  #loadingData {
    text-align: center;
    color: var(--muted);
    padding: 30px 0;
    font-size: 12px;
  }
  #loadingData .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--neon);
    margin: 0 2px;
    animation: pulse 1s infinite ease-in-out;
    box-shadow: 0 0 8px var(--neon-glow);
  }
  #loadingData .dot:nth-child(2) { animation-delay: 0.15s; }
  #loadingData .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  .empty-state { text-align: center; padding: 26px 10px; color: var(--muted); font-size: 12px; }

  @media (max-width: 420px) {
    .metric .v { font-size: 18px; }
    .datetime-row { flex-direction: column; }
    .btn-now { padding: 10px 0; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <h1>XAUUSD<span class="cursor"></span></h1>
    <div class="pair">jurnal trading pribadi</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('inputTab', this)">Entry baru</button>
    <button class="tab-btn" onclick="switchTab('dashTab', this)">Performa</button>
  </div>

  <!-- TAB 1: FORM INPUT -->
  <div id="inputTab" class="tab-content active">
    <div class="panel">
      <p class="panel-title">Detail posisi</p>
      <form id="tradingForm">
        <div class="form-group">
          <label for="tanggal">Tanggal &amp; waktu</label>
          <div class="datetime-row">
            <input type="datetime-local" id="tanggal" name="tanggal" required>
            <button type="button" class="btn-now" id="btnNow">Sekarang</button>
          </div>
        </div>

        <div class="form-group">
          <label>Posisi</label>
          <div class="seg">
            <input type="radio" id="posBuy" name="posisi" value="Buy" checked>
            <input type="radio" id="posSell" name="posisi" value="Sell">
            <label for="posBuy">Buy</label>
            <label for="posSell">Sell</label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group"><label for="entry">Entry</label><input type="number" step="0.01" id="entry" name="entry" placeholder="2350.00" required></div>
          <div class="form-group"><label for="sl">Stop loss</label><input type="number" step="0.01" id="sl" name="sl" placeholder="2345.00" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="tp">Take profit</label><input type="number" step="0.01" id="tp" name="tp" placeholder="2360.00" required></div>
          <div class="form-group"><label for="exit">Exit (opsional)</label><input type="number" step="0.01" id="exit" name="exit" placeholder="Isi bila sudah close"></div>
        </div>

        <div class="preview" id="previewBox">
          <div class="cell"><div class="k">Risk : reward</div><div class="v neutral" id="prevRR">—</div></div>
          <div class="cell"><div class="k">Hasil (jika exit diisi)</div><div class="v neutral" id="prevPips">—</div></div>
        </div>

        <div class="form-group">
          <label for="catatan">Catatan setup</label>
          <textarea id="catatan" name="catatan" rows="2" placeholder="Konfluensi, alasan entry, dsb."></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Simpan trading</button>
        <div id="statusMessage"></div>
      </form>
    </div>
  </div>

  <!-- TAB 2: DASHBOARD -->
  <div id="dashTab" class="tab-content">
    <div class="month-nav">
      <button type="button" id="prevMonth" aria-label="Bulan sebelumnya">‹</button>
      <input type="month" id="monthFilter">
      <button type="button" id="nextMonth" aria-label="Bulan berikutnya">›</button>
    </div>

    <div id="loadingData"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>

    <div id="dashboardBody" style="display:none;">
      <div class="metric-grid wide-first">
        <div class="metric"><div class="k">Net pips bulan ini</div><div class="v" id="netPips">0</div></div>
        <div class="metric"><div class="k">Win rate</div><div class="v neutral" id="winRate">0%</div></div>
        <div class="metric"><div class="k">Profit factor</div><div class="v neutral" id="profitFactor">—</div></div>
        <div class="metric"><div class="k">Total trade</div><div class="v neutral" id="totalTrades">0</div></div>
        <div class="metric"><div class="k">Win / Loss / BEP</div><div class="v neutral" id="winLossBep">0 / 0 / 0</div></div>
      </div>

      <div class="panel">
        <p class="panel-title">Kurva ekuitas (pips)</p>
        <div class="equity-box" id="equityBox"></div>
      </div>

      <div class="panel">
        <p class="panel-title">Riwayat trade</p>
        <div class="log-scroll">
          <table class="trade-log" id="tradeLogTable">
            <thead>
              <tr><th>Tgl</th><th>Pos</th><th>Entry</th><th>Exit</th><th>Pips</th><th>Hasil</th></tr>
            </thead>
            <tbody id="tradeLogBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // MASUKKAN URL WEB APP ANDA DI SINI
  const scriptURL = "https://script.google.com/macros/s/AKfycbyoO1_Nnn2w7xkpY6idrmKao4cFxe-URFV9nqd_sfUeNAVyOZogWDFrA6596WRxtm_WRQ/exec";
  let allTradingData = [];
  let dataLoaded = false;

  // ---------- Tabs ----------
  function switchTab(tabId, btnElement) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');
    if (tabId === 'dashTab' && !dataLoaded) fetchDataFromSheet();
  }

  // ---------- "Sekarang" helper ----------
  function localDatetimeValue(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  document.getElementById('btnNow').addEventListener('click', () => {
    document.getElementById('tanggal').value = localDatetimeValue(new Date());
  });

  // ---------- Live preview (RR & potential pips) ----------
  const entryEl = document.getElementById('entry');
  const slEl = document.getElementById('sl');
  const tpEl = document.getElementById('tp');
  const exitEl = document.getElementById('exit');
  const prevRR = document.getElementById('prevRR');
  const prevPips = document.getElementById('prevPips');

  function getPosisi() {
    return document.querySelector('input[name="posisi"]:checked').value;
  }

  function updatePreview() {
    const entry = parseFloat(entryEl.value);
    const sl = parseFloat(slEl.value);
    const tp = parseFloat(tpEl.value);
    const exit = parseFloat(exitEl.value);
    const posisi = getPosisi();

    if (!isNaN(entry) && !isNaN(sl) && !isNaN(tp) && sl !== entry) {
      const risk = Math.abs(entry - sl);
      const reward = Math.abs(tp - entry);
      const rr = (reward / risk).toFixed(2);
      prevRR.textContent = `1 : ${rr}`;
      prevRR.className = 'v neutral';
    } else {
      prevRR.textContent = '—';
      prevRR.className = 'v neutral';
    }

    if (!isNaN(entry) && !isNaN(exit)) {
      let pips = posisi === 'Buy' ? (exit - entry) * 10 : (entry - exit) * 10;
      pips = Math.round(pips * 100) / 100;
      prevPips.textContent = (pips > 0 ? '+' : '') + pips.toFixed(2) + ' pips';
      prevPips.className = 'v ' + (pips > 0 ? 'pos' : pips < 0 ? 'neg' : 'neutral');
    } else {
      prevPips.textContent = 'Belum ada exit';
      prevPips.className = 'v neutral';
    }
  }
  [entryEl, slEl, tpEl, exitEl].forEach(el => el.addEventListener('input', updatePreview));
  document.querySelectorAll('input[name="posisi"]').forEach(el => el.addEventListener('change', updatePreview));

  // ---------- Submit ----------
  const form = document.getElementById('tradingForm');
  const btn = document.getElementById('submitBtn');
  const statusDiv = document.getElementById('statusMessage');

  form.addEventListener('submit', e => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';
    statusDiv.textContent = '';
    statusDiv.className = '';

    fetch(scriptURL, { method: 'POST', body: new FormData(form) })
      .then(res => res.json())
      .then(data => {
        if (data.result === 'error') throw new Error(data.error || 'Unknown error');
        statusDiv.textContent = 'Trade tersimpan.';
        statusDiv.className = 'ok';
        form.reset();
        document.getElementById('posBuy').checked = true;
        updatePreview();
        btn.disabled = false;
        btn.textContent = 'Simpan trading';
        allTradingData = [];
        dataLoaded = false;
        setTimeout(() => { statusDiv.textContent = ''; }, 3500);
      })
      .catch(err => {
        statusDiv.textContent = 'Gagal menyimpan: ' + err.message;
        statusDiv.className = 'err';
        btn.disabled = false;
        btn.textContent = 'Simpan trading';
      });
  });

  // ---------- Fetch dashboard data ----------
  function fetchDataFromSheet() {
    document.getElementById('loadingData').style.display = 'block';
    document.getElementById('dashboardBody').style.display = 'none';

    fetch(scriptURL)
      .then(res => res.json())
      .then(response => {
        if (response.result === 'error') throw new Error(response.error);
        allTradingData = response.data || [];
        dataLoaded = true;
        setDefaultMonthIfEmpty();
        processData();
      })
      .catch(() => {
        document.getElementById('loadingData').innerHTML = 'Gagal memuat data. Coba lagi nanti.';
      });
  }

  function setDefaultMonthIfEmpty() {
    if (document.getElementById('monthFilter').value) return;
    const today = new Date();
    document.getElementById('monthFilter').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  }

  document.getElementById('monthFilter').addEventListener('change', processData);
  document.getElementById('prevMonth').addEventListener('click', () => shiftMonth(-1));
  document.getElementById('nextMonth').addEventListener('click', () => shiftMonth(1));

  function shiftMonth(delta) {
    const input = document.getElementById('monthFilter');
    if (!input.value) return;
    const [y, m] = input.value.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    input.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    processData();
  }

  // ---------- Calculations ----------
  function processData() {
    document.getElementById('loadingData').style.display = 'none';
    document.getElementById('dashboardBody').style.display = 'block';

    const filterValue = document.getElementById('monthFilter').value;
    if (!filterValue) return;

    const monthTrades = allTradingData
      .filter(row => row.Tanggal && row.Tanggal.substring(0, 7) === filterValue)
      .filter(row => row.Hasil === 'Win' || row.Hasil === 'Loss' || row.Hasil === 'BEP')
      .sort((a, b) => new Date(a.Tanggal) - new Date(b.Tanggal));

    let wins = 0, losses = 0, bep = 0, netPips = 0, winPips = 0, lossPips = 0;
    monthTrades.forEach(row => {
      const p = parseFloat(row.Pips) || 0;
      netPips += p;
      if (row.Hasil === 'Win') { wins++; winPips += p; }
      else if (row.Hasil === 'Loss') { losses++; lossPips += Math.abs(p); }
      else bep++;
    });

    const total = monthTrades.length;
    const winRate = total > 0 ? ((wins / total) * 100).toFixed(1) : '0';
    const profitFactor = lossPips > 0 ? (winPips / lossPips).toFixed(2) : (winPips > 0 ? '∞' : '—');

    const netPipsEl = document.getElementById('netPips');
    netPipsEl.textContent = (netPips > 0 ? '+' : '') + netPips.toFixed(2) + ' pips';
    netPipsEl.className = 'v ' + (netPips > 0 ? 'pos' : netPips < 0 ? 'neg' : 'neutral');

    document.getElementById('winRate').textContent = winRate + '%';
    document.getElementById('profitFactor').textContent = profitFactor;
    document.getElementById('totalTrades').textContent = total;
    document.getElementById('winLossBep').textContent = `${wins} / ${losses} / ${bep}`;

    renderEquityCurve(monthTrades);
    renderTradeLog(monthTrades);
  }

  function renderEquityCurve(trades) {
    const box = document.getElementById('equityBox');
    if (trades.length === 0) {
      box.innerHTML = '<div class="equity-empty">Belum ada trade selesai bulan ini.</div>';
      return;
    }
    let cum = 0;
    const points = trades.map(t => { cum += parseFloat(t.Pips) || 0; return cum; });
    const w = 300, h = 90, pad = 6;
    const min = Math.min(0, ...points);
    const max = Math.max(0, ...points);
    const range = (max - min) || 1;
    const stepX = points.length > 1 ? (w - pad * 2) / (points.length - 1) : 0;
    const coords = points.map((v, i) => {
      const x = pad + i * stepX;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return [x, y];
    });
    const path = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
    const zeroY = h - pad - ((0 - min) / range) * (h - pad * 2);
    const lineColor = cum >= 0 ? '#39ff8c' : '#ff3d81';
    box.innerHTML = `
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <line x1="0" y1="${zeroY.toFixed(1)}" x2="${w}" y2="${zeroY.toFixed(1)}" stroke="rgba(57,255,140,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
        <path d="${path}" fill="none" stroke="${lineColor}" stroke-width="2" style="filter:drop-shadow(0 0 4px ${lineColor})"/>
        ${coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2" fill="${lineColor}"/>`).join('')}
      </svg>`;
  }

  function renderTradeLog(trades) {
    const body = document.getElementById('tradeLogBody');
    if (trades.length === 0) {
      body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px 6px;">Belum ada riwayat</td></tr>';
      return;
    }
    body.innerHTML = trades.slice().reverse().map(t => {
      const d = new Date(t.Tanggal);
      const dateLabel = isNaN(d) ? String(t.Tanggal).slice(0, 10) : `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
      const badgeClass = t.Hasil === 'Win' ? 'win' : t.Hasil === 'Loss' ? 'loss' : 'bep';
      const pips = parseFloat(t.Pips) || 0;
      return `<tr>
        <td>${dateLabel}</td>
        <td>${t.Posisi || ''}</td>
        <td>${t.Entry ?? ''}</td>
        <td>${t.Exit ?? ''}</td>
        <td>${(pips > 0 ? '+' : '') + pips.toFixed(2)}</td>
        <td><span class="badge ${badgeClass}">${t.Hasil}</span></td>
      </tr>`;
    }).join('');
  }
</script>

</body>
</html>
